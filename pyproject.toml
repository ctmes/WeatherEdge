[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weatheredge"
version = "0.1.0"
description = "Polymarket weather trading bot — find the gap between forecast models and market prices"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "scipy>=1.12",
    "numpy>=1.26",
    "pandas>=2.1",
    "polars>=1.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
dashboard = [
    "streamlit>=1.30",
]

[project.scripts]
weatheredge = "weatheredge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: live API calls (deselect with '-m \"not integration\"')",
]
